# Configuración local de Supabase — Relojes Carrasco
# Documentación: https://supabase.com/docs/guides/local-development

project_id = "relojes-carrasco"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "storage"]
extra_search_path = ["public"]
# Límite de filas por respuesta de la API (paginación obligatoria).
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Servidor de correo local para probar emails de auth.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Los usuarios NO se registran solos: los crea el operador
# desde el panel de Supabase (igual que en producción).
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.mfa]
# Preparado para MFA opcional (TOTP). Se puede habilitar sin cambios de esquema.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
