<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {"id":"gancho","type":"string","label":"Gancho (primeros 3 segundos)","default":"¿Buscás un Rolex Datejust?","maxLength":70},
    {"id":"estilo","type":"enum","label":"Estilo del gancho","default":"elegante","options":[{"value":"elegante","label":"Elegante"},{"value":"impacto","label":"Impacto"},{"value":"pregunta","label":"Pregunta"}]},
    {"id":"marca","type":"string","label":"Marca","default":"Rolex","maxLength":40},
    {"id":"modelo","type":"string","label":"Modelo","default":"Datejust 41","maxLength":60},
    {"id":"referencia","type":"string","label":"Referencia","default":"Ref. 126334","maxLength":40},
    {"id":"precio","type":"string","label":"Precio","default":"US$ 16.000","maxLength":30},
    {"id":"cierre","type":"string","label":"Llamado del cierre","default":"Consultá por mensaje directo","maxLength":60},
    {"id":"usuario","type":"string","label":"Cuenta","default":"@relojes_carrasco","maxLength":40},
    {"id":"web","type":"string","label":"Sitio","default":"relojescarrasco.com","maxLength":40},
    {"id":"name","type":"string","label":"Nombre del archivo (render en lote)","default":"version-1","maxLength":40}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #120f0c;
        --ink: #f8f5ef;
        --gold: #e2c27d;
        --gold-deep: #b8914a;
        --dark: #1d1915;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: "Inter", sans-serif;
        color: var(--ink);
      }

      /* Material filmado */
      #clip {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #sombra-arriba {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 900px;
        background: linear-gradient(180deg, rgba(10, 8, 6, 0.82) 0%, rgba(10, 8, 6, 0.55) 60%, rgba(10, 8, 6, 0) 100%);
      }
      #sombra-abajo {
        position: absolute;
        left: 0;
        top: 960px;
        width: 1080px;
        height: 960px;
        background: linear-gradient(0deg, rgba(10, 8, 6, 0.78) 0%, rgba(10, 8, 6, 0.4) 50%, rgba(10, 8, 6, 0) 100%);
      }

      /* Gancho: tres estilos, se muestra uno */
      #gancho {
        position: absolute;
        left: 0;
        top: 330px;
        width: 1080px;
        height: 520px;
      }
      .estilo {
        position: absolute;
        left: 130px;
        top: 0;
        width: 820px;
      }
      #gancho-elegante {
        text-align: left;
      }
      #gancho-elegante .marca-chica {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.32em;
        color: var(--gold);
      }
      #gancho-elegante .linea-dorada {
        width: 120px;
        height: 3px;
        margin: 26px 0 30px;
        background: var(--gold);
        transform-origin: left center;
      }
      #gancho-elegante .texto {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: 82px;
        line-height: 1.08;
        font-weight: 400;
      }
      #gancho-impacto {
        text-align: center;
      }
      #gancho-impacto .texto {
        font-family: "Archivo Black", sans-serif;
        font-size: 100px;
        line-height: 1.02;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }
      #gancho-impacto .texto .w:last-child {
        color: var(--gold);
      }
      #gancho-pregunta {
        display: flex;
        justify-content: center;
      }
      #gancho-pregunta .caja {
        max-width: 820px;
        padding: 36px 44px 40px;
        border-radius: 28px;
        background: var(--ink);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      #gancho-pregunta .texto {
        font-size: 72px;
        line-height: 1.1;
        font-weight: 900;
        color: var(--dark);
        text-align: center;
      }
      .w {
        display: inline-block;
      }

      /* Rótulo del producto */
      #rotulo {
        position: absolute;
        left: 130px;
        top: 320px;
        width: 800px;
      }
      #rotulo-marca {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.34em;
        color: var(--gold);
        text-transform: uppercase;
      }
      #rotulo-modelo {
        margin-top: 14px;
        font-family: "Playfair Display", serif;
        font-size: 74px;
        line-height: 1.05;
      }
      #rotulo-referencia {
        margin-top: 12px;
        font-size: 32px;
        color: rgba(248, 245, 239, 0.82);
      }
      #rotulo-precio {
        display: inline-block;
        margin-top: 26px;
        padding: 14px 26px 16px;
        border-radius: 999px;
        background: var(--gold);
        color: var(--dark);
        font-size: 44px;
        font-weight: 800;
      }

      /* Subtítulos */
      #subtitulos {
        position: absolute;
        left: 0;
        top: 1160px;
        width: 1080px;
        height: 230px;
      }
      .grupo {
        position: absolute;
        left: 160px;
        top: 0;
        width: 760px;
        text-align: center;
        font-size: 62px;
        line-height: 1.16;
        font-weight: 900;
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.65);
      }
      .grupo .caja-sub {
        display: inline-block;
        padding: 6px 22px 10px;
        border-radius: 20px;
        background: rgba(10, 8, 6, 0.42);
      }
      .grupo .p {
        display: inline-block;
        margin: 0 0.12em;
      }

      /* Cierre */
      #cierre {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      #cierre-fondo {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 55% at 50% 40%, #3a3026 0%, var(--ground) 72%);
      }
      #cierre-contenido {
        position: absolute;
        left: 160px;
        top: 520px;
        width: 760px;
        text-align: center;
      }
      #cierre-logo {
        width: 210px;
        height: 210px;
        object-fit: contain;
      }
      #cierre-llamado {
        margin-top: 56px;
        font-size: 42px;
        font-weight: 600;
      }
      #cierre-usuario {
        margin-top: 18px;
        font-family: "Playfair Display", serif;
        font-size: 68px;
        color: var(--gold);
      }
      #cierre-web {
        margin-top: 22px;
        font-size: 34px;
        letter-spacing: 0.08em;
        color: rgba(248, 245, 239, 0.72);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__TOTAL__"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="clip"
        class="clip"
        data-start="0"
        data-duration="__VIDEO__"
        data-track-index="0"
        src="assets/clip.mp4"
        muted
        playsinline
      ></video>
      <!--VOZ-->

      <div id="sombra-arriba" class="clip" data-start="0" data-duration="__VIDEO__" data-track-index="2"></div>
      <div id="sombra-abajo" class="clip" data-start="0" data-duration="__VIDEO__" data-track-index="3"></div>

      <div id="gancho" class="clip" data-start="0.15" data-duration="2.65" data-track-index="4">
        <div id="gancho-elegante" class="estilo">
          <p class="marca-chica" data-var-text="marca">Rolex</p>
          <div class="linea-dorada"></div>
          <p class="texto">¿Buscás un Rolex Datejust?</p>
        </div>
        <div id="gancho-impacto" class="estilo">
          <p class="texto">¿Buscás un Rolex Datejust?</p>
        </div>
        <div id="gancho-pregunta" class="estilo">
          <div class="caja"><p class="texto">¿Buscás un Rolex Datejust?</p></div>
        </div>
      </div>

      <div id="rotulo" class="clip" data-start="2.9" data-duration="__ROTULO__" data-track-index="5">
        <p id="rotulo-marca" data-var-text="marca">Rolex</p>
        <p id="rotulo-modelo" data-var-text="modelo">Datejust 41</p>
        <p id="rotulo-referencia" data-var-text="referencia">Ref. 126334</p>
        <p id="rotulo-precio" data-var-text="precio">US$ 16.000</p>
      </div>

      <div id="subtitulos" data-track-kind="captions">
        <!--SUBTITULOS-->
      </div>

      <div id="cierre" class="clip" data-start="__CIERRE__" data-duration="__CIERRE_DUR__" data-track-index="7">
        <div id="cierre-fondo"></div>
        <div id="cierre-contenido">
          <img id="cierre-logo" src="assets/logo.png" alt="" />
          <p id="cierre-llamado" data-var-text="cierre">Consultá por mensaje directo</p>
          <p id="cierre-usuario" data-var-text="usuario">@relojes_carrasco</p>
          <p id="cierre-web" data-var-text="web">relojescarrasco.com</p>
        </div>
      </div>
    </div>

    <script>
      const SUBTITULOS = __SUBTITULOS_JSON__;
      const CIERRE = __CIERRE__;
      const ROTULO_FIN = 2.9 + __ROTULO__;

      const v = (window.__hyperframes && window.__hyperframes.getVariables()) || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- Gancho ----------
      const estilos = ["elegante", "impacto", "pregunta"];
      const activo = estilos.includes(v.estilo) ? v.estilo : "elegante";
      const gancho = (v.gancho || "").trim() || "¿Buscás un reloj con historia?";
      for (const estilo of estilos) {
        const bloque = document.getElementById("gancho-" + estilo);
        if (estilo !== activo) {
          bloque.style.display = "none";
          continue;
        }
        const texto = bloque.querySelector(".texto");
        texto.innerHTML = gancho
          .split(/\s+/)
          .map((palabra) => '<span class="w">' + palabra.replace(/[<>&]/g, "") + "</span>")
          .join(" ");
      }
      const palabrasGancho = "#gancho-" + activo + " .texto .w";
      const t0 = 0.15; // inicio del gancho (tiempo absoluto)

      if (activo === "elegante") {
        tl.fromTo("#gancho-elegante .marca-chica", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, t0 + 0.05);
        tl.fromTo("#gancho-elegante .linea-dorada", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "expo.out" }, t0 + 0.12);
        tl.fromTo(palabrasGancho, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, t0 + 0.3);
      } else if (activo === "impacto") {
        tl.fromTo("#gancho-impacto .texto", { opacity: 0, scale: 1.12, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, t0 + 0.05);
      } else {
        tl.fromTo("#gancho-pregunta .caja", { opacity: 0, scale: 0.6, rotation: -7 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.5, ease: "back.out(1.4)" }, t0 + 0.05);
      }
      // Salida limpia y más corta que la entrada.
      tl.to("#gancho-" + activo, { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, t0 + 2.65 - 0.24);

      // ---------- Rótulo ----------
      for (const id of ["marca", "modelo", "referencia", "precio"]) {
        if (!(v[id] || "").trim()) document.getElementById("rotulo-" + id).style.display = "none";
      }
      const r0 = 2.9;
      tl.fromTo("#rotulo-marca", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, r0);
      tl.fromTo("#rotulo-modelo", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, r0 + 0.18);
      tl.fromTo("#rotulo-referencia", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, r0 + 0.38);
      tl.fromTo("#rotulo-precio", { opacity: 0, clipPath: "inset(0 100% 0 0 round 999px)" }, { opacity: 1, clipPath: "inset(0 0% 0 0 round 999px)", duration: 0.55, ease: "expo.out" }, r0 + 0.9);
      tl.to("#rotulo", { opacity: 0, duration: 0.25, ease: "power2.in" }, ROTULO_FIN - 0.3);

      // ---------- Subtítulos ----------
      SUBTITULOS.forEach((grupo, i) => {
        const el = "#sub-" + i;
        tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, grupo.start);
        grupo.words.forEach((palabra, j) => {
          const w = el + " .p:nth-child(" + (j + 1) + ")";
          tl.set(w, { color: "#d4b06a" }, palabra.start);
          tl.set(w, { color: "#f8f5ef" }, Math.max(palabra.start + 0.05, palabra.end));
        });
        tl.to(el, { opacity: 0, duration: 0.12, ease: "power2.in" }, grupo.end - 0.12);
        tl.set(el, { opacity: 0, visibility: "hidden" }, grupo.end);
      });

      // ---------- Cierre ----------
      tl.fromTo("#cierre-fondo", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, CIERRE);
      tl.fromTo("#cierre-logo", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, CIERRE + 0.2);
      tl.fromTo(
        ["#cierre-llamado", "#cierre-usuario", "#cierre-web"],
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.14, ease: "power2.out" },
        CIERRE + 0.5
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
